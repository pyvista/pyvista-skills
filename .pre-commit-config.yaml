repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      # Python files only: Markdown code blocks are owned by prettier.
      # ruff >= 0.17 formats python-in-markdown and fights prettier.
      - id: ruff
        args: [--fix]
        files: \.py$
      - id: ruff-format
        files: \.py$
